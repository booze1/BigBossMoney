<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0E14" />
    <meta name="description" content="Big Boss Money — build a business empire from nothing." />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Big Boss Money</title>
    <script type="module" crossorigin src="./assets/index-C6rddbfd.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BObvNihs.css">
  </head>
  <body>
    <!--
      React clears #root on first render, so this is a splash for the moment
      before the bundle boots — and, if the bundle never boots, the difference
      between a diagnosable page and a silent blank one. Styles are inline
      because in the failure case the stylesheet has not loaded either.
    -->
    <div id="root">
      <div id="boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0B0E14;color:#E8EDF5;font:500 15px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;padding:24px">
        <div style="font-size:19px;font-weight:700;letter-spacing:-0.01em">Big Boss Money</div>
        <div id="boot-msg" style="opacity:0.55">Opening up…</div>
      </div>
    </div>
    <script>
      // Ten seconds is far longer than a cold load; if we are still here the
      // app bundle did not arrive.
      setTimeout(function () {
        var msg = document.getElementById('boot-msg');
        if (msg) msg.textContent = 'Could not load the game files. Reload, or check back shortly.';
      }, 10000);
    </script>
    <!--
      Vite rewrites this line at build time, so the onerror only ever fires on a
      host serving this file verbatim — which is what the Pages branch build
      does. /src/main.tsx cannot run as a static file, so hand off to build/,
      the committed copy of the real bundle. See README, "Why build/ is
      committed". Harmless everywhere else: in dev the module loads and the
      handler never runs.
    -->
  </body>
</html>
